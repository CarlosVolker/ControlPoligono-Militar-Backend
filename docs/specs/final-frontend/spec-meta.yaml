# ---------------------------------------------------------------------------
# Notas de trazabilidad (no normativas del schema; se conservan aquí porque
# spec-meta.yaml es la única fuente de verdad de esta spec).
#
# Numeración: `docs/specs/` no contenía specs vigentes ni en `archive/`, por lo
# que corresponde `max(existentes) + 1` = 001. Slug tomado del nombre de la
# carpeta `final-frontend`.
#
# Estado: `approved` (2026-10-02). El operador aprobó el alcance de forma
# explícita («Apruebo el alcance»: TypeScript, 36 pantallas, 99 flujos, 8 ejes)
# y la orden de ejecución ya se había dado antes («Empieza con la construccion
# del frontend»). Ni la aprobación ni esa orden superan gates automáticamente:
# ningún gate está en `passed`, `verified_at` sigue en null, la revisión del
# plan de implementación sigue pendiente y el inicio efectivo de la
# implementación queda sujeto a esa revisión — no se concede autorización de
# implementación (docs/sdd.md > Estados; la aprobación de alcance no equivale a
# veredicto VALIDATED del gate de plan).
#
# Gates y reviewers:
#   - `security_review: required` y `qa_goblin: required` derivan de los hard
#     triggers activos `auth`, `permissions` y `sensitive-data`
#     (docs/routing-triggers.md > Vocabulario risk.flags y gates).
#   - `tests: required` porque el cliente tiene lógica testeable (cliente HTTP,
#     validación de forma, anti-carrera, autosave de apariencia, guards).
#   - `kobold_scholar: required` (dominio, obligatorio): revisión del modelo de
#     datos y la migración de los ocho campos de preferencias. Entregada y
#     aceptada; su diseño es el que figura en technical-design.md §5.1–§5.2.
#   - `portal_warden: required` (dominio, obligatorio): revisión del contrato de
#     la API de preferencias. Entregada y aceptada; su diseño figura en
#     technical-design.md §5.3.
#   - `arcane_architect` queda en `n/a`: la navegación se resolvió con
#     `vue-router`, una dependencia ya aprobada por el operador y sin cambio
#     estructural transversal en el backend.
#   - El flag `new-api` está ACTIVO: la spec introduce el subrecurso
#     `me/preferences/appearance/design-system/`. Es compatible con el contrato
#     existente y no altera la ruta legacy.
#   - Ningún gate está en `passed`. No se ejecutó build, lint, tests, navegador,
#     servidor, instalación de dependencias ni escritura en base de datos.
#     La migración de preferencias NO está aprobada ni aplicada.
#
# Decisiones (requirements.md §12):
#   D-01  RETIRADA. La correspondencia `palette`/`density` → ejes del Design
#         System ya no se plantea: el operador ordenó persistir las ocho
#         opciones del personalizador del Design System. `palette` y `density`
#         no tienen eje en la fuente, no se traducen ni se reinterpretan, y sus
#         campos quedan intactos y sin uso visual.
#   D-02  ABIERTA. Amplitud de backend para las capacidades de requirements §8
#         (exportación, transferencia de stock, validación de resultados,
#         edición de datos propios, comandantes, historial global, catálogo de
#         permisos). No bloquea el alcance declarado.
#   D-03  RESUELTA. Tenant inicial: selección manual de la institución real como
#         parte del login. No se crea endpoint de bootstrap, no se pide lista de
#         tenants al backend y no se hardcodea código de demostración.
#   D-04  RESUELTA. Mapeo de los endpoints de soporte de authz en
#         technical-design.md §8.
#   D-05  RESUELTA. Navegación: `vue-router@5.3.1` con `createWebHistory` es
#         obligatorio. La navegación por hash manual del borrador anterior queda
#         derogada. La instalación de la dependencia es fase de implementación,
#         posterior a la aprobación.
#   D-06  RESUELTA. Persistencia de apariencia: ocho campos `ds_*` en `Usuario`,
#         una migración y una ruta de preferencias propia. La persistencia del
#         Design System en `localStorage` se sustituye por memoria + backend.
#   D-08  RESUELTA. Lenguaje del código objetivo: TypeScript, por orden explícita
#         del operador del 2026-10-02 («se tiene que usar TS, no JS»). Deroga la
#         regla previa «JavaScript, no TypeScript» (sincronizada en AGENTS.md,
#         front/AGENTS.md, docs/00_INDEX.md, requirements.md §1/§7/§12,
#         technical-design.md §1/§13 e index.md). `<script setup lang="ts">` y
#         módulos `.ts` para router/HTTP/stores/composables propuestos. Hechos
#         conservados: el baseline actual de front/src/ es JavaScript y no se
#         afirma migrado; el kit externo del DS sigue siendo HTML/CSS/JS como
#         referencia. La migración y el tooling de tipos son fase de
#         implementación y requieren orden explícita; un typecheck no acredita
#         por sí solo el resultado de usuario. Detalle en requirements.md §12.
#
# Huellas de backend documentadas sin modificar el backend (requirements §9):
#   B-01  `apipoligono/views.py:880` usa `primary_unit(usuario)`, definido sólo
#         dentro de `reporte` (`views.py:954`). Sospecha de `NameError` NO
#         comprobada en runtime: no se autorizó levantar el servidor. Permanece
#         como hipótesis, y ningún cambio de esta spec la afecta.
#   B-02  RETIRADO. `../../Inume Design System/` resuelve desde la raíz del
#         repositorio y su contenido fue leído (46 entradas). No bloquea nada.
#   B-03  `CORS/CSRF_TRUSTED_ORIGINS` por defecto incluyen `localhost:5173` y
#         Vite sirve en 5175. Con el proxy de Vite las peticiones son
#         same-origin y CORS/CSRF no aplican: escenario no verificado y no
#         bloqueante. No se modifica `.env`.
#   B-04  El proveedor de base de datos del entorno de ejecución NO está
#         confirmado: no se leyó `.env` ni se abrió ninguna conexión. Por eso el
#         diseño de migración es ORM y no incluye SQL por motor ni procedimiento
#         de producción.
#
# Runtime del backend:
#   El operador informó que el backend ya está en ejecución en
#   `127.0.0.1:8000`. Esa información es **reportada por el operador y no
#   verificada** por esta revisión. No se levantó, no se reinició y no se detuvo
#   ningún proceso, y no se leyó la bitácora del servidor. La autorización para
#   levantar el cliente o abrir el navegador sigue pendiente. Ningún PID se
#   persiste como estado de la spec, porque es efímero.
#
# ---------------------------------------------------------------------------
